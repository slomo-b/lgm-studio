[package]
name = "splatcage"
version = "0.1.0"
edition = "2021"
description = "Raeumliche Schranke fuer Gaussian Splats: Voxelhuelle aus Silhouetten carven, Splats darauf begrenzen"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
